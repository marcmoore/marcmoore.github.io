<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快捷启动</title>
    <style>
        /* 1. 全局和基础设置 */
        html,
        body {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            position: relative;
            background-color: #0d011a;
            overflow: hidden;
        }

        /* 2. 大面积彩色变换背景 (保持不变) */
        body::before {
            content: '';
            position: absolute;
            width: 350%;
            height: 350%;
            top: -125%;
            left: -125%;
            background:
                radial-gradient(circle at 10% 10%, #7d26c9 0%, transparent 40%),
                radial-gradient(circle at 70% 20%, #ff1493 0%, transparent 40%),
                radial-gradient(circle at 30% 80%, #00bfff 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, #32cd32 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #ffd700 0%, transparent 40%);
            background-size: 35% 35%;
            background-repeat: no-repeat;
            opacity: 0.25;
            animation: flowingColors 40s infinite alternate ease-in-out;
            z-index: -1;
            mix-blend-mode: screen;
        }

        @keyframes flowingColors {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.25;
                filter: blur(150px) hue-rotate(0deg);
                background-position: 0% 0%, 70% 20%, 30% 80%, 90% 90%, 50% 50%;
            }

            20% {
                transform: translate(20px, -30px) scale(1.05);
                opacity: 0.3;
                filter: blur(150px) hue-rotate(72deg);
                background-position: 10% 10%, 80% 30%, 40% 70%, 100% 80%, 60% 60%;
            }

            40% {
                transform: translate(-40px, 10px) scale(1);
                opacity: 0.25;
                filter: blur(150px) hue-rotate(144deg);
                background-position: -10% -10%, 60% 10%, 20% 90%, 80% 100%, 40% 40%;
            }

            60% {
                transform: translate(30px, 40px) scale(1.05);
                opacity: 0.3;
                filter: blur(150px) hue-rotate(216deg);
                background-position: 5% 5%, 75% 15%, 35% 85%, 95% 95%, 55% 55%;
            }

            80% {
                transform: translate(-10px, -20px) scale(1);
                opacity: 0.25;
                filter: blur(150px) hue-rotate(288deg);
                background-position: 15% 15%, 65% 25%, 25% 75%, 85% 85%, 45% 45%;
            }

            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.25;
                filter: blur(150px) hue-rotate(360deg);
                background-position: 0% 0%, 70% 20%, 30% 80%, 90% 90%, 50% 50%;
            }
        }

        /* --- 2.5. 新增：顶部首页按钮 --- */
        .home-button {
            width: 48px;
            height: 48px;
            flex-shrink: 0;

            /* 关键：羽化边缘效果 */
            background: radial-gradient(circle,
                    rgba(10, 10, 10, 0.7) 40%,
                    /* 中心是 70% 透明的深黑色 */
                    transparent 70%
                    /* 边缘 70% 处开始完全透明 */
                );

            border-radius: 50%;
            /* 确保是圆形 */
            z-index: 10;
            /* 确保在其他内容之上 */

            /* 触摸反馈 */
            transition: transform 0.15s ease, background 0.15s ease;

            /* Layout in sidebar */
            margin-bottom: 10px;
        }

        /* 顶部按钮的触摸效果 */
        .home-button:active {
            transform: scale(0.90);
            /* 按下时缩小 */
            background: radial-gradient(circle,
                    rgba(0, 0, 0, 0.8) 40%,
                    /* 按下时颜色更深 */
                    transparent 70%);
        }

        /* -------------------------- */

        /* Layout Panels */
        .left-panel {
            width: 200px;
            /* Reduced from 25% to fixed narrow width */
            flex-shrink: 0;
            /* Prevent shrinking */
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 30px;
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 2;
            position: relative;
            box-sizing: border-box;
            overflow-y: auto;

            /* Enable vertical scrolling */
            /* Hide scrollbar for Chrome/Safari/Opera */
            &::-webkit-scrollbar {
                display: none;
            }

            /* Hide scrollbar for IE, Edge and Firefox */
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }

        .right-panel {
            flex: 1;
            /* Take remaining space */
            height: 100%;
            position: relative;
            z-index: 1;
            overflow-y: auto;
            /* Scrollable for many widgets */
        }

        /* Widget Grid Layout */
        .widget-grid {
            display: grid;
            /* Increased min-width to 460px to force 2 columns on standard 1080p screens (less crowded) */
            grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
            gap: 32px;
            /* Default Gap */
            padding: 40px;
            box-sizing: border-box;
            width: 100%;
            /* grid-auto-rows removed to let aspect-ratio dictate height */
        }

        /* Large Laptop / Small Desktop */
        @media (max-width: 1600px) {
            .widget-grid {
                grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
                gap: 24px;
                padding: 30px;
            }
        }

        /* Tablet / Small Laptop */
        /* Tablet / Small Laptop - Force 2 Columns max */
        @media (max-width: 1400px) {
            .widget-grid {
                grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
                /* 450px min ensures max 2 cols on ~1000-1200px space */
                gap: 20px;
                padding: 20px;
            }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .widget-grid {
                grid-template-columns: 1fr;
                /* Force 1 column */
                padding: 15px;
            }

            .left-panel {
                display: none;
                /* Hide sidebar on mobile if needed, or adjust */
                /* For now, let's keep it but maybe smaller or toggleable. 
                   User didn't ask to hide it, but 200px is a lot on phone. 
                   Let's assume iPad context mostly. */
            }
        }

        /* Widget Card Styling */
        .widget-card {
            width: 100%;
            aspect-ratio: 1.618 / 1;
            /* Golden Ratio */
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .widget-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Expanded Widget State */
        .widget-card.expanded {
            grid-row: span 2;
            height: auto;
            /* 
               Force height to be approx 2x standard card + gap.
               Standard ratio is 1.618 (Golden Ratio).
               Height = Width / 1.618.
               Target Height = 2 * (Width / 1.618) + Gap.
               New Ratio = Width / Target Height ~= 0.75 to 0.8 depending on gap.
               0.75 is a safe bet to ensure it's tall enough to span 2 rows visually.
            */
            aspect-ratio: 0.75;
        }

        /* Widget Header */
        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            /* Default background removed, will be set by specific classes */
        }

        /* Header Color Variants */
        .header-stock {
            background: linear-gradient(90deg, rgba(33, 150, 243, 0.2), transparent);
        }

        .header-crypto {
            background: linear-gradient(90deg, rgba(255, 152, 0, 0.2), transparent);
        }

        .header-watchlist {
            background: linear-gradient(90deg, rgba(76, 175, 80, 0.2), transparent);
        }

        .header-news {
            background: linear-gradient(90deg, rgba(156, 39, 176, 0.2), transparent);
        }

        .widget-title {
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Stock Tabs */
        .stock-tabs {
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.3);
            padding: 3px;
            border-radius: 8px;
            overflow-x: auto;
            flex-wrap: nowrap;
            scrollbar-width: none;
            /* Firefox */
            -webkit-overflow-scrolling: touch;
        }

        .stock-tabs::-webkit-scrollbar {
            display: none;
            /* Chrome/Safari */
        }

        .stock-tab {
            padding: 4px 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .stock-tab.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-weight: 500;
        }

        /* Chart Container */
        .chart-container {
            flex: 1;
            width: 100%;
            min-height: 200px;
            /* Ensure visibility */
            position: relative;
        }

        /* 3. 按钮容器 */
        .button-container {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            /* Prevent top clipping when scrolling */
            align-items: center;
            gap: 30px;
            padding: 20px;
            width: 100%;
            /* Allow container to grow with content */
            flex-shrink: 0;
            box-sizing: border-box;
        }

        /* 4. "黑灰玻璃" 按钮样式 */
        .icon-button {
            width: 140px;
            height: 140px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(12px);
            border-radius: 35px;
            border: 1px solid rgba(100, 100, 100, 0.3);
            box-shadow: 0 8px 20px 0 rgba(0, 0, 0, 0.4);
            text-decoration: none;
            color: #FFFFFF;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 5. IMG 标签的样式 */
        .icon-button img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            padding: 10px;
            box-sizing: border-box;
            -webkit-user-drag: none;
            user-select: none;
        }

        /* 6. 触摸效果 */
        .icon-button:active {
            transform: scale(0.95);
            background: rgba(40, 40, 40, 0.5);
            border-color: rgba(150, 150, 150, 0.4);
            box-shadow: 0 4px 15px 0 rgba(0, 0, 0, 0.3);
            transition-duration: 0.1s;
        }

        /* Drag and Drop Styles */
        .draggable {
            /* cursor: grab; Removed global grab cursor */
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
        }

        /* Drag Handles */
        .widget-header {
            cursor: grab;
        }

        .widget-header:active {
            cursor: grabbing;
        }

        .icon-button.draggable {
            cursor: grab;
        }

        .icon-button.draggable:active {
            cursor: grabbing;
        }

        .dragging {
            opacity: 0.5;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            pointer-events: none;
            /* Critical for stable dragover detection */
        }

        /* 7. News Widget Styles */
        .news-list {
            height: 100%;
            overflow-y: auto;
            padding-right: 5px;
            display: flex;
            flex-direction: column;
            gap: 0;
            /* Ensure it doesn't overflow parent */
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .news-list::-webkit-scrollbar {
            width: 4px;
        }

        .news-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .news-item {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-decoration: none;
            transition: background 0.2s;
            display: block;
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .news-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        /* Highlight for relevant news */
        .news-item.highlight {
            border-left: 3px solid #ffd700;
            /* Gold border */
            background: rgba(255, 215, 0, 0.05);
        }

        .news-item.highlight .news-title {
            color: #fff;
            font-weight: 600;
        }
    </style>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>

<body>

    <div class="left-panel">
        <a href="https://v.qq.com/search_redirect.html?url=https%3A%2F%2Fwww.1905.com%2Fapi%2Fredirec.html%3Fredirect_url%3Dhttps%253A%252F%252Fmarcmoore.github.io%252Ftv%253Fwww.1905.com"
            class="home-button" aria-label="返回首页"></a>
        <div class="button-container" id="app">
        </div>
    </div>

    <div class="right-panel">
        <div class="widget-grid" id="widgetGrid">
            <!-- Widget 1: US Stock Market -->
            <div class="widget-card draggable" id="widget-stock" draggable="true">
                <div class="widget-header header-stock">
                    <div class="widget-title">
                        US Market
                    </div>
                    <div class="stock-tabs">
                        <div class="stock-tab active" onclick="switchStock('DJI')">Dow Jones</div>
                        <div class="stock-tab" onclick="switchStock('SPX')">S&P 500</div>
                        <div class="stock-tab" onclick="switchStock('NDX')">Nasdaq</div>
                    </div>
                </div>
                <div class="chart-container" id="stockChart"></div>
            </div>

            <!-- Widget 2: Crypto Market -->
            <div class="widget-card draggable" id="widget-crypto" draggable="true">
                <div class="widget-header header-crypto">
                    <div class="widget-title">
                        Crypto
                    </div>
                    <div class="stock-tabs">
                        <div class="stock-tab active" onclick="switchCrypto('BTC')">BTC</div>
                        <div class="stock-tab" onclick="switchCrypto('ETH')">ETH</div>
                        <div class="stock-tab" onclick="switchCrypto('SOL')">SOL</div>
                    </div>
                </div>
                <div class="chart-container" id="cryptoChart"></div>
            </div>

            <!-- Widget 3: Watchlist -->
            <div class="widget-card draggable" id="widget-watchlist" draggable="true">
                <div class="widget-header header-watchlist">
                    <div class="widget-title">
                        Watchlist
                    </div>
                    <div class="stock-tabs" style="max-width: 70%;">
                        <div class="stock-tab active" onclick="switchIndividualStock('TSLA')">TSLA</div>
                        <div class="stock-tab" onclick="switchIndividualStock('BABA')">BABA</div>
                        <div class="stock-tab" onclick="switchIndividualStock('AAPL')">AAPL</div>
                        <div class="stock-tab" onclick="switchIndividualStock('META')">META</div>
                        <div class="stock-tab" onclick="switchIndividualStock('NVDA')">NVDA</div>
                        <div class="stock-tab" onclick="switchIndividualStock('TSM')">TSM</div>
                    </div>
                </div>
                <div class="chart-container" id="watchlistChart"></div>
            </div>

            <!-- Widget 4: Market News -->
            <div class="widget-card draggable" id="widget-news" draggable="true">
                <div class="widget-header header-news">
                    <div class="widget-title">
                        News
                    </div>
                    <div class="stock-tabs">
                        <div class="stock-tab" onclick="toggleNewsHeight(this)" title="Toggle Height">⤢</div>
                    </div>
                </div>
                <div class="chart-container" style="position: relative;">
                    <div id="newsList" class="news-list">
                        <div style="padding: 20px; text-align: center; color: rgba(255,255,255,0.3);">Loading news...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 配置数组：在这里添加或修改您的按钮
        // 格式：{ name: "名字", url: "原始链接", icon: "图片路径" }
        const websites = [
            {
                name: "YouTube",
                url: "https://youtube.com",
                icon: "./assets/youtube.svg" // 请确保您的文件名匹配
            },
            {
                name: "OpenStack",
                url: "https://hbomax.com",
                icon: "./assets/hbo.svg"
            },
            {
                name: "Button 3",
                url: "https://netflix.com",
                icon: "./assets/netflix.svg" // 记得替换
            },
            {
                name: "Button 4",
                url: "https://disneyplus.com",
                icon: "./assets/disney.svg" // 记得替换
            },
            {
                name: "Button 5",
                url: "http://47.237.5.17:3000",
                icon: "./assets/openstock.jpg" // 记得替换
            }
        ];

        // 2. 链接转换函数：将原始链接转换成多重跳转链接
        function generateComplexRedirect(originalUrl) {
            if (!originalUrl) return "#";

            // 第一步：在原始链接后添加 ?www.1905.com
            // 注意：这里假设原始链接没有query参数，如果有需要更复杂的判断，但对于主页通常够用
            const step1 = originalUrl + "?www.1905.com";

            // 第二步：构建 1905 跳转链接 (对 step1 进行编码)
            // https://www.1905.com/api/redirec.html?redirect_url=[编码后的step1]
            const step2 = "https://www.1905.com/api/redirec.html?redirect_url=" + encodeURIComponent(step1);

            // 第三步：构建 QQ 跳转链接 (对 step2 进行编码)
            // https://v.qq.com/search_redirect.html?url=[编码后的step2]
            const finalUrl = "https://v.qq.com/search_redirect.html?url=" + encodeURIComponent(step2);

            return finalUrl;
        }

        // 3. 自动渲染按钮
        const container = document.getElementById('app');

        function renderButtons() {
            container.innerHTML = '';
            // Load order from LocalStorage
            const savedOrder = JSON.parse(localStorage.getItem('buttonOrder'));
            let displayList = websites;

            if (savedOrder) {
                // Sort websites based on saved names
                const ordered = [];
                savedOrder.forEach(name => {
                    const site = websites.find(w => w.name === name);
                    if (site) ordered.push(site);
                });
                // Add any new sites not in saved order
                websites.forEach(site => {
                    if (!ordered.includes(site)) ordered.push(site);
                });
                displayList = ordered;
            }

            displayList.forEach(site => {
                const link = document.createElement('a');
                link.className = 'icon-button draggable';
                link.draggable = true; // Enable drag
                link.setAttribute('data-name', site.name); // ID for tracking
                link.setAttribute('aria-label', '跳转到 ' + site.name);
                link.href = generateComplexRedirect(site.url);

                const img = document.createElement('img');
                img.src = site.icon;
                img.alt = site.name + ' Logo';

                link.appendChild(img);
                container.appendChild(link);
            });

            // Re-init drag events for new buttons
            initDragAndDrop(container, 'buttonOrder');
        }

        renderButtons();

        // --- Drag and Drop Logic (Robust Grid Support + Touch) ---
        // Global variable to track dragged item across scopes if needed, 
        // but we can also rely on document.querySelector('.dragging')

        function initDragAndDrop(container, storageKey) {
            // Mouse Events
            container.addEventListener('dragstart', (e) => {
                const draggable = e.target.closest('.draggable');
                if (!draggable) return;

                // For widgets, restrict drag to non-interactive areas
                if (draggable.classList.contains('widget-card')) {
                    if (e.target.closest('.chart-container') || e.target.closest('.stock-tab') || e.target.tagName === 'BUTTON') {
                        e.preventDefault();
                        return;
                    }
                }

                // Delay adding the class so drag initialization completes
                setTimeout(() => {
                    draggable.classList.add('dragging');
                }, 0);

                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', ''); // Required for Firefox
            });

            container.addEventListener('dragend', (e) => {
                const draggable = e.target.closest('.draggable');
                if (draggable) {
                    draggable.classList.remove('dragging');
                    saveOrder(container, storageKey);
                }
            });

            container.addEventListener('dragover', (e) => {
                e.preventDefault(); // Allow drop

                const draggedItem = document.querySelector('.dragging');
                if (!draggedItem) return;

                // Identify target under cursor
                const target = e.target.closest('.draggable');

                if (target && target !== draggedItem && container.contains(target)) {
                    // Zone check
                    const isWidget = draggedItem.classList.contains('widget-card');
                    const targetIsWidget = target.classList.contains('widget-card');
                    // Strict zone isolation
                    if (isWidget && container.id !== 'widgetGrid') return;
                    if (!isWidget && container.id !== 'app') return;
                    if (isWidget !== targetIsWidget) return;

                    // Swap Logic
                    const children = [...container.children];
                    const draggedIndex = children.indexOf(draggedItem);
                    const targetIndex = children.indexOf(target);

                    if (draggedIndex < targetIndex) {
                        // Dragging downwards/rightwards -> Insert after target
                        container.insertBefore(draggedItem, target.nextSibling);
                    } else {
                        // Dragging upwards/leftwards -> Insert before target
                        container.insertBefore(draggedItem, target);
                    }
                }
            });

            // Touch Events (Long Press to Drag)
            let longPressTimer = null;
            let isTouchDragging = false;
            let touchItem = null;
            let startX = 0;
            let startY = 0;

            container.addEventListener('touchstart', (e) => {
                const target = e.target.closest('.draggable');
                if (!target) return;

                // For widgets, restrict drag to non-interactive areas
                if (target.classList.contains('widget-card')) {
                    if (e.target.closest('.chart-container') || e.target.closest('.stock-tab') || e.target.tagName === 'BUTTON') {
                        return;
                    }
                }

                touchItem = target;
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;

                // Start Long Press Timer (500ms)
                longPressTimer = setTimeout(() => {
                    isTouchDragging = true;
                    touchItem.classList.add('dragging');
                    if (navigator.vibrate) navigator.vibrate(50);
                }, 500);
            }, { passive: false });

            container.addEventListener('touchmove', (e) => {
                if (!touchItem) return;
                const touch = e.touches[0];

                if (isTouchDragging) {
                    if (e.cancelable) e.preventDefault();

                    // Manual hit testing for touch
                    const elementUnderFinger = document.elementFromPoint(touch.clientX, touch.clientY);
                    const target = elementUnderFinger ? elementUnderFinger.closest('.draggable') : null;

                    if (target && target !== touchItem && container.contains(target)) {
                        // Zone check
                        const isWidget = touchItem.classList.contains('widget-card');
                        const targetIsWidget = target.classList.contains('widget-card');
                        if (isWidget !== targetIsWidget) return;

                        const children = [...container.children];
                        const draggedIndex = children.indexOf(touchItem);
                        const targetIndex = children.indexOf(target);

                        if (draggedIndex < targetIndex) {
                            container.insertBefore(touchItem, target.nextSibling);
                        } else {
                            container.insertBefore(touchItem, target);
                        }
                    }
                } else {
                    const moveX = Math.abs(touch.clientX - startX);
                    const moveY = Math.abs(touch.clientY - startY);
                    if (moveX > 10 || moveY > 10) {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                    }
                }
            }, { passive: false });

            container.addEventListener('touchend', (e) => {
                if (longPressTimer) clearTimeout(longPressTimer);

                if (isTouchDragging && touchItem) {
                    touchItem.classList.remove('dragging');
                    saveOrder(container, storageKey);
                }

                isTouchDragging = false;
                touchItem = null;
                longPressTimer = null;
            });
        }

        function saveOrder(container, key) {
            const items = [...container.querySelectorAll('.draggable')];
            if (key === 'buttonOrder') {
                order = items.map(item => item.getAttribute('data-name'));
            } else {
                order = items.map(item => item.id);
            }
            localStorage.setItem(key, JSON.stringify(order));
        }

        // Helper: Ensure data is sorted and unique for Lightweight Charts
        function processData(data) {
            if (!data || data.length === 0) return [];

            // 1. Sort by time ascending
            data.sort((a, b) => new Date(a.time) - new Date(b.time));

            // 2. Remove duplicates
            const uniqueData = [];
            const seenTimes = new Set();
            for (const item of data) {
                if (!seenTimes.has(item.time)) {
                    seenTimes.add(item.time);
                    uniqueData.push(item);
                }
            }
            return uniqueData;
        }

        // Fetch Real Data from Tencent (GTimg) - Works great in China
        async function fetchStockData(symbol) {
            // Tencent Stock API for US stocks
            // Symbol mapping: DJI -> usDJI, SPX -> usINX, NDX -> usIXIC
            // URL: https://web.ifzq.gtimg.cn/appstock/app/usfqkline/get?param=[symbol],day,,,[days],qfq

            const tencentSymbolMap = {
                '^DJI': 'usDJI',
                '^GSPC': 'usINX',
                '^IXIC': 'usIXIC'
            };
            const tSymbol = tencentSymbolMap[symbol] || symbol;
            const url = `https://web.ifzq.gtimg.cn/appstock/app/usfqkline/get?param=${tSymbol},day,,,90,qfq`;

            try {
                console.log(`Fetching stock data for ${tSymbol} from Tencent...`);
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const json = await response.json();
                if (json.code !== 0 || !json.data || !json.data[tSymbol] || !json.data[tSymbol].day) {
                    throw new Error('Invalid Tencent API response');
                }

                // Tencent Format: [Date, Open, Close, High, Low, Volume, ...]
                const rawData = json.data[tSymbol].day;

                const parsedData = rawData.map(item => {
                    const open = parseFloat(item[1]);
                    const close = parseFloat(item[2]);
                    const high = parseFloat(item[3]);
                    const low = parseFloat(item[4]);

                    if (isNaN(open) || isNaN(close) || isNaN(high) || isNaN(low)) return null;

                    return {
                        time: item[0], // "YYYY-MM-DD"
                        open: open,
                        close: close,
                        high: high,
                        low: low
                    };
                }).filter(item => item !== null);

                console.log(`Parsed ${parsedData.length} valid candles for ${tSymbol}`);
                return parsedData;

            } catch (error) {
                console.warn('Error fetching stock data, falling back to mock data:', error);
                return null;
            }
        }

        // Mock Data Generator (Fallback)
        function generateMockData(basePrice, volatility) {
            const data = [];
            let time = new Date();
            time.setMonth(time.getMonth() - 3);

            for (let i = 0; i < 90; i++) {
                time.setDate(time.getDate() + 1);
                if (time.getDay() === 0 || time.getDay() === 6) continue;

                const open = basePrice + (Math.random() - 0.5) * volatility;
                const high = open + Math.random() * volatility;
                const low = open - Math.random() * volatility;
                const close = (open + high + low) / 3 + (Math.random() - 0.5) * volatility;

                data.push({
                    time: time.toISOString().split('T')[0],
                    open: open,
                    high: high,
                    low: low,
                    close: close,
                });
                basePrice = close;
            }
            return data;
        }

        async function loadStockData(symbol) {

            // Fallback if API fails

                data = generateMockData(basePrice, basePrice * 0.015);

            if (data && data.length > 0) {

                try {

        }

        // Fetch Real Crypto Data from CoinGecko (Primary, Public, Reliable)
        async function fetchCryptoData(symbol) {
            const idMap = {
                'BTC': 'bitcoin',
                'ETH': 'ethereum',
                'SOL': 'solana'
            };
            const id = idMap[symbol] || symbol.toLowerCase();
            const url = `https://api.coingecko.com/api/v3/coins/${id}/ohlc?vs_currency=usd&days=90`;

            try {
                console.log(`Fetching crypto data for ${id} from CoinGecko...`);
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();
                // CoinGecko format: [ [time(ms), open, high, low, close], ... ]

                // Filter to get only 1 candle per day (closest to midnight)
                const dailyData = [];
                const seenDays = new Set();

                // Sort by time ascending just in case
                data.sort((a, b) => a[0] - b[0]);

                for (const item of data) {
                    const date = new Date(item[0]);
                    const dateStr = date.toISOString().split('T')[0];

                    if (!seenDays.has(dateStr)) {
                        seenDays.add(dateStr);
                        dailyData.push({
                            time: dateStr,
                            open: item[1],
                            high: item[2],
                            low: item[3],
                            close: item[4]
                        });
                    }
                }

                console.log(`Parsed ${dailyData.length} daily crypto candles from CoinGecko`);
                return dailyData;
            } catch (e) {
                console.warn('CoinGecko fallback also failed', e);
                return null;
            }
        }

        // Fetch Hourly Data (60m) for Watchlist from Yahoo Finance (Reliable)
        async function fetchWatchlistData(symbol) {
            // Yahoo Finance: 60m interval, 7d range
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=60m&range=7d`;
            // Use corsproxy.io
            const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);

            try {
                console.log(`Fetching hourly data for ${symbol} from Yahoo...`);
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const json = await response.json();
                if (!json.chart || !json.chart.result || json.chart.result.length === 0) {
                    throw new Error('Invalid Yahoo response');
                }

                const result = json.chart.result[0];
                const timestamps = result.timestamp;
                const quotes = result.indicators.quote[0];

                const data = [];
                for (let i = 0; i < timestamps.length; i++) {
                    // Filter nulls
                    if (quotes.open[i] === null || quotes.close[i] === null) continue;

                    data.push({
                        time: timestamps[i], // Unix timestamp (seconds)
                        open: parseFloat(quotes.open[i].toFixed(2)),
                        high: parseFloat(quotes.high[i].toFixed(2)),
                        low: parseFloat(quotes.low[i].toFixed(2)),
                        close: parseFloat(quotes.close[i].toFixed(2))
                    });
                }

                console.log(`Parsed ${data.length} hourly candles for ${symbol}`);
                return data;

            } catch (error) {
                console.warn('Error fetching watchlist data:', error);
                return null;
            }
        }

        async function loadWatchlistData(symbol) {
            let data = await fetchWatchlistData(symbol);

            if (!data || data.length === 0) {

        // --- 7. News Widget Logic ---
        let newsScrollInterval;
        let isNewsPaused = false;

        async function fetchNews() {
            const container = document.getElementById('newsList');

            // 1. Define Sources (Prioritize JSON APIs for speed)
            // CryptoCompare: Fast, JSON, covers Crypto & Tech
            const cryptoCompareUrl = 'https://min-api.cryptocompare.com/data/v2/news/?lang=EN';

            // Yahoo Finance (JSON endpoint via proxy is faster than parsing XML)
            // We'll stick to a reliable proxy for Yahoo
            // Note: Yahoo RSS is often slow. Let's try to use a more direct JSON if available, 
            // but for now, let's optimize the proxy usage or switch to a different aggregator.
            // Let's use a "TechCrunch" or similar fast RSS via a JSON converter.

            // Actually, let's use `rss2json` online converter for better speed than raw XML parsing
            const yahooRss = `https://finance.yahoo.com/rss/headline?s=TSLA,BABA,AAPL,META,NVDA,TSM,BTC-USD`;
            const yahooJsonUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(yahooRss)}`;

            const sources = [
                { name: 'CryptoCompare', url: cryptoCompareUrl, type: 'cc' },
                { name: 'Yahoo Finance', url: yahooJsonUrl, type: 'rss2json' }
            ];

            const fetchPromises = sources.map(async (source) => {
                try {
                    const response = await fetch(source.url);
                    if (!response.ok) return [];
                    const json = await response.json();

                    if (source.type === 'cc') {
                        // CryptoCompare format
                        return json.Data.map(item => ({
                            source: item.source_info.name,
                            title: item.title,
                            link: item.url,
                            pubDate: new Date(item.published_on * 1000)
                        }));
                    } else if (source.type === 'rss2json') {
                        // rss2json format
                        if (json.status !== 'ok') return [];
                        return json.items.map(item => ({
                            source: 'Yahoo',
                            title: item.title,
                            link: item.link,
                            pubDate: new Date(item.pubDate)
                        }));
                    }
                    return [];
                } catch (e) {
                    console.warn(`Failed to fetch ${source.name}:`, e);
                    return [];
                }
            });

            try {
                const results = await Promise.all(fetchPromises);
                const allNews = results.flat();

                if (allNews.length === 0) {
                    container.innerHTML = '<div style="padding: 20px; text-align: center; color: rgba(255,255,255,0.3);">No news found</div>';
                    return;
                }

                // 3. Sort by Date (Newest First)
                allNews.sort((a, b) => b.pubDate - a.pubDate);

                // 4. Highlight Keywords
                const keywords = ['TSLA', 'Tesla', 'BABA', 'Alibaba', 'AAPL', 'Apple', 'META', 'Facebook', 'NVDA', 'Nvidia', 'TSM', 'TSMC', 'BTC', 'Bitcoin', 'ETH', 'Ethereum', 'SOL', 'Solana'];

                let html = '';
                // Limit to top 40 items
                allNews.slice(0, 40).forEach(item => {
                    // Check for highlight
                    const isRelevant = keywords.some(k => item.title.includes(k));
                    const highlightClass = isRelevant ? 'highlight' : '';

                    // Format time
                    const now = new Date();
                    const diffMs = now - item.pubDate;
                    const diffMins = Math.floor(diffMs / 60000);
                    const diffHours = Math.floor(diffMins / 60);
                    let timeDisplay = diffMins < 60 ? `${diffMins}m ago` : (diffHours < 24 ? `${diffHours}h ago` : item.pubDate.toLocaleDateString());

                    html += `
                        <a href="${item.link}" target="_blank" class="news-item ${highlightClass}">
                            <div class="news-title">${item.title}</div>
                            <div class="news-meta">
                                <span>${item.source}</span>
                                <span>${timeDisplay}</span>
                            </div>
                        </a>
                    `;
                });

                container.innerHTML = html;
                console.log(`Loaded ${allNews.length} news items`);

                // Start Scrolling Logic
                setupAutoScroll(container);

            } catch (error) {
                console.error('Error fetching news:', error);
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: rgba(255,255,255,0.3);">Failed to load news</div>';
            }
        }

        function setupAutoScroll(container) {
            // Clear existing interval if any
            if (newsScrollInterval) clearInterval(newsScrollInterval);

            // Scroll function
            const scrollStep = () => {
                if (isNewsPaused) return;

                // Simple logic: Scroll down by ~80px (approx one item height)
                // If we reach bottom, reset to top (or we could implement infinite loop by moving DOM nodes, but let's keep it simple first)

                const currentScroll = container.scrollTop;
                const maxScroll = container.scrollHeight - container.clientHeight;

                if (currentScroll >= maxScroll - 5) {
                    // Reset to top smoothly
                    container.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    container.scrollBy({ top: 80, behavior: 'smooth' });
                }
            };

            // Set Interval: 6 seconds
            newsScrollInterval = setInterval(scrollStep, 6000);

            // Event Listeners for Pause
            container.onmouseenter = () => { isNewsPaused = true; };
            container.onmouseleave = () => { isNewsPaused = false; };
            container.ontouchstart = () => { isNewsPaused = true; };
            container.ontouchend = () => { isNewsPaused = false; };

            // Also detect manual scroll to pause temporarily? 
            // The hover/touch logic covers most user intent.
        }

        // Init and Auto-refresh News every 15 minutes
        fetchNews();
        setInterval(fetchNews, 900000);

        // Toggle News Height
        function toggleNewsHeight(btn) {
            const widget = document.getElementById('widget-news');
            widget.classList.toggle('expanded');

            const isExpanded = widget.classList.contains('expanded');
            btn.textContent = isExpanded ? '⤡' : '⤢';

            // Save state
            localStorage.setItem('newsExpanded', isExpanded);
        }

        // Restore News Height
        const savedNewsExpanded = localStorage.getItem('newsExpanded') === 'true';
        if (savedNewsExpanded) {
            const widget = document.getElementById('widget-news');
            const btn = widget.querySelector('.stock-tab');
            widget.classList.add('expanded');
            btn.textContent = '⤡';
        }
    </script>
